name: Build and smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Build server jar
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :server:shadowJar --stacktrace 2>&1 | tee build.log

      - name: Start server
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          MANGA_READER_DATA="$RUNNER_TEMP/data" MANGA_READER_LOG_LEVEL=DEBUG \
            nohup java -jar server/build/manga-reader-*.jar > server.log 2>&1 &

      - name: Smoke test
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/smoke_test.py http://127.0.0.1:4567 2>&1 | tee smoke.log

      - name: Check web UI is served
        run: |
          curl -fsS http://127.0.0.1:4567/ | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:4567/source/123/manga?url=x | grep -q '<div id="app">'

      - name: Screenshots
        if: success()
        working-directory: scripts
        shell: bash
        run: |
          set -o pipefail
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          node screenshots.mjs http://127.0.0.1:4567 ../screenshots 2>&1 | tee ../screenshots.log

      - name: Server log
        if: always()
        run: tail -n 400 server.log || true

      # Logs are also committed to the ci-logs branch so they can be read with plain git
      - name: Publish logs to ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci-logs
          if [ -d screenshots ]; then cp -r screenshots /tmp/ci-logs/; fi
          for f in build.log smoke.log server.log screenshots.log; do if [ -f "$f" ]; then cp "$f" /tmp/ci-logs/; fi; done
          mkdir -p /tmp/ci-logs/extensions
          cp "$RUNNER_TEMP"/data/extensions/*.jar /tmp/ci-logs/extensions/ 2>/dev/null || true
          echo "run ${{ github.run_id }} commit ${{ github.sha }} status ${{ job.status }}" > /tmp/ci-logs/STATUS
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "logs for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manga-reader
          path: |
            server/build/manga-reader-*.jar
            server.log
          if-no-files-found: ignore
